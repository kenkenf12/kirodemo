<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Analysis - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #c33;
            font-size: 14px;
        }

        .demo-credentials {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            border-left: 4px solid #667eea;
        }

        .demo-credentials h4 {
            color: #667eea;
            font-size: 13px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .demo-credentials p {
            color: #666;
            font-size: 13px;
            margin: 5px 0;
            font-family: monospace;
            background: white;
            padding: 5px 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
            text-decoration: underline;
        }

        .copy-btn:hover {
            color: #764ba2;
        }

        .version {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .logo {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <div class="logo">🔒</div>
            <h1>Security Analysis</h1>
            <p>Multi-Agent Log Analysis System</p>
        </div>

        <div id="errorMsg" class="error"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="demo-credentials">
            <h4>📝 Demo Credentials</h4>
            <p>
                <span><strong>Username:</strong> admin</span>
                <button class="copy-btn" onclick="copyToClipboard('admin')">copy</button>
            </p>
            <p>
                <span><strong>Password:</strong> security123</span>
                <button class="copy-btn" onclick="copyToClipboard('security123')">copy</button>
            </p>
        </div>

        <div class="version">
            Multi-Agent Security Monitoring v1.0
        </div>
    </div>

    <script>
        // Demo credentials (in production, use proper backend authentication)
        const DEMO_USERS = {
            'admin': 'security123',
            'analyst': 'analysis456',
            'reviewer': 'review789'
        };

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // Validate credentials
            if (!DEMO_USERS[username] || DEMO_USERS[username] !== password) {
                errorMsg.textContent = '❌ Invalid username or password';
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                return;
            }

            // Store session in localStorage
            const sessionToken = btoa(username + ':' + Date.now());
            localStorage.setItem('sessionToken', sessionToken);
            localStorage.setItem('username', username);
            localStorage.setItem('loginTime', new Date().toISOString());

            // Redirect to upload page
            window.location.href = './upload.html';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ copied';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            if (localStorage.getItem('sessionToken')) {
                window.location.href = './upload.html';
            }
        });
    </script>
</body>
</html>
