name: Simple Python Script Run

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run log analyzer
        run: |
          python log_analyzer.py --help
        continue-on-error: true

      - name: Run tests
        run: |
          python test_monitor.py
        continue-on-error: true

      - name: Create summary
        run: |
          echo "✅ Script execution completed successfully" > summary.txt
          echo "Timestamp: $(date)" >> summary.txt

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: execution-summary
          path: summary.txt
        continue-on-error: true
