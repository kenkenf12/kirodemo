name: Run Security Analysis on Push

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.py'
      - '**.log'
      - '.github/workflows/run-analysis.yml'

jobs:
  security-analysis:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pylint flake8 coverage

      - name: Lint with Pylint
        run: |
          pylint web_app.py synthesis_agent.py log_analyzer.py log_monitor.py --exit-zero
        continue-on-error: true

      - name: Check code style with Flake8
        run: |
          flake8 web_app.py synthesis_agent.py log_analyzer.py log_monitor.py --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Run tests
        run: |
          pytest test_monitor.py -v --tb=short
        continue-on-error: true

      - name: Generate test report
        run: |
          coverage run -m pytest test_monitor.py
          coverage report -m
          coverage xml
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Create analysis output directory
        run: mkdir -p analysis_reports

      - name: Run log analysis script
        run: |
          python log_analyzer.py --input test_security.log --output analysis_reports/report.json
        continue-on-error: true

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports-py${{ matrix.python-version }}
          path: analysis_reports/
        continue-on-error: true

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Security analysis completed! Check artifacts for detailed reports.'
            })
        continue-on-error: true
