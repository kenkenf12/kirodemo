name: Web Server Integration Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'web_app.py'
      - 'synthesis_agent.py'
      - '.github/workflows/web-server-test.yml'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  server-test:
    runs-on: ubuntu-latest
    
    services:
      sqlite:
        image: busybox:latest
        options: --health-cmd "ls /" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Create test directories
        run: |
          mkdir -p /tmp/logs
          mkdir -p /tmp/workspace
          mkdir -p /tmp/workspace/logs
          mkdir -p /tmp/workspace/reports

      - name: Create test log file
        run: |
          cat > /tmp/logs/test.log << 'EOF'
          [2024-01-15T10:23:45Z] [INFO] Application started
          [2024-01-15T10:24:12Z] [ERROR] Failed login attempt from 192.168.1.5
          [2024-01-15T10:24:13Z] [ERROR] Failed login attempt from 192.168.1.5
          [2024-01-15T10:24:14Z] [CRITICAL] Brute force attack detected
          [2024-01-15T10:25:30Z] [ERROR] AWS credentials detected in logs
          EOF

      - name: Start web server
        run: |
          python web_app.py &
          sleep 3
        env:
          PYTHONUNBUFFERED: 1

      - name: Test API endpoints
        run: |
          python << 'EOF'
          import requests
          import json
          import time
          
          base_url = "http://localhost:8000"
          time.sleep(2)
          
          print("Testing API endpoints...")
          
          # Test 1: Login
          print("\n1. Testing /api/login...")
          response = requests.post(
              f"{base_url}/api/login",
              json={"username": "admin", "password": "admin123"},
              headers={"Content-Type": "application/json"}
          )
          print(f"   Status: {response.status_code}")
          assert response.status_code == 200, f"Login failed: {response.text}"
          data = response.json()
          session_id = data.get('session_id')
          print(f"   ✓ Login successful")
          
          # Test 2: Check status
          print("\n2. Testing /api/status...")
          response = requests.get(f"{base_url}/api/status")
          print(f"   Status: {response.status_code}")
          print(f"   ✓ Status check successful")
          
          # Test 3: Get reports
          print("\n3. Testing /api/reports...")
          headers = {"Cookie": f"session_id={session_id}"}
          response = requests.get(
              f"{base_url}/api/reports",
              headers=headers
          )
          print(f"   Status: {response.status_code}")
          if response.status_code == 200:
              data = response.json()
              print(f"   Reports count: {len(data.get('reports', []))}")
          print(f"   ✓ Reports endpoint working")
          
          print("\n✅ All API tests passed!")
          EOF

      - name: Stop web server
        run: |
          pkill -f "python web_app.py" || true
        continue-on-error: true

      - name: Generate test results
        run: |
          echo "Web Server Integration Tests - PASSED" > test_results.txt
          echo "All API endpoints responding correctly" >> test_results.txt
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: web-server-test-results
          path: test_results.txt
        continue-on-error: true
